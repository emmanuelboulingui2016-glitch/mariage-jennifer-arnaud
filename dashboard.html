<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5b0d1b">
  <meta name="description" content="Dashboard privé — confirmations de présence — Jennifer & Arnaud">
  <meta name="robots" content="noindex, nofollow">
  <title>Dashboard RSVP — Jennifer & Arnaud</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RSVP J&A">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { wine: '#5b0d1b', wine2: '#7a1528', gold: '#c9a227', cream: '#fbf7ef', ink: '#241a1b' },
          fontFamily: { serif: ['Playfair Display', 'serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background: #fbf7ef;
      color: #241a1b;
    }

    .serif {
      font-family: 'Playfair Display', serif;
    }

    .card {
      background: #fff;
      border: 1px solid #eee1c6;
      border-radius: 16px;
    }

    .badge-oui {
      background: #f4ead0;
      color: #7a5c0e;
    }

    .badge-non {
      background: #f3e3e6;
      color: #7a1528;
    }

    #lockScreen {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #5b0d1b;
    }

    .filter-btn {
      border: 1px solid #d6c9a8;
      color: #786b64;
    }

    .filter-btn.active {
      background: #5b0d1b;
      border-color: #5b0d1b;
      color: #fff;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Écran verrouillé tant qu'aucun jeton valide n'est trouvé -->
  <div id="lockScreen" class="flex items-center justify-center p-6">
    <div class="max-w-sm text-center text-cream">
      <div class="text-4xl mb-3">🔒</div>
      <h1 class="serif text-2xl text-white mb-2">Accès privé</h1>
      <p class="text-sm text-white/70">Ce dashboard n'est accessible qu'avec le lien privé transmis aux mariés.</p>
    </div>
  </div>

  <div id="app" class="hidden max-w-2xl mx-auto px-4 pb-16 pt-8">
    <header class="text-center mb-6">
      <div class="text-xs tracking-[.2em] uppercase text-gold">Jennifer &amp; Arnaud</div>
      <h1 class="serif text-3xl mt-1">Confirmations RSVP</h1>
      <p class="text-xs text-stone-500 mt-1">13 Novembre 2026</p>
    </header>

    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="card p-4 text-center">
        <div class="text-2xl font-semibold serif" id="statTotal">–</div>
        <div class="text-[11px] uppercase tracking-wide text-stone-500 mt-1">Réponses</div>
      </div>
      <div class="card p-4 text-center">
        <div class="text-2xl font-semibold serif text-gold" id="statOui">–</div>
        <div class="text-[11px] uppercase tracking-wide text-stone-500 mt-1">Présents</div>
      </div>
      <div class="card p-4 text-center">
        <div class="text-2xl font-semibold serif text-wine" id="statNon">–</div>
        <div class="text-[11px] uppercase tracking-wide text-stone-500 mt-1">Absents</div>
      </div>
    </div>

    <p class="text-center text-[11px] text-stone-400 mb-6">
      👁 <span id="statVisites">–</span> visites · ✨ <span id="statScratchs">–</span> cartes grattées
    </p>

    <div class="flex gap-2 mb-3">
      <button type="button" class="filter-btn active flex-1 rounded-full px-3 py-1.5 text-xs"
        data-filter="all">Tous</button>
      <button type="button" class="filter-btn flex-1 rounded-full px-3 py-1.5 text-xs" data-filter="Oui">Oui</button>
      <button type="button" class="filter-btn flex-1 rounded-full px-3 py-1.5 text-xs" data-filter="Non">Non</button>
    </div>


    <div class="flex gap-2 mb-4">
      <input id="search" type="text" placeholder="Rechercher un invité..."
        class="flex-1 border border-stone-300 rounded-full px-4 py-2 text-sm focus:outline-none focus:border-gold">
      <button id="refreshBtn" class="px-4 py-2 rounded-full border border-stone-300 text-sm hover:border-gold"
        aria-label="Actualiser">↻</button>
    </div>

    <div id="list" class="space-y-2"></div>
    <p id="empty" class="hidden text-center text-sm text-stone-400 py-10">Aucune réponse pour le moment.</p>
    <p id="lastUpdate" class="text-center text-[11px] text-stone-400 mt-6"></p>

    <button id="installBtn"
      class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 bg-wine text-white text-sm px-5 py-3 rounded-full shadow-lg">
      Installer sur l'écran d'accueil
    </button>
  </div>

  <script>
    /* ===================== CONFIGURATION =====================
       Même URL Apps Script (/exec) que dans index.html — coller après déploiement.
    */
    const RSVP_ENDPOINT = "https://script.google.com/macros/s/AKfycbzRszatTa7oJLFwPMaCKtkLHJQ3OlggStRKi0zANrCORirV7YXx2-FFzKIsC__Zu4ru/exec";

    /* ===================== JETON D'ACCÈS =====================
       Le lien privé donné aux mariés contient ?cle=XXXX.
       On le mémorise sur l'appareil pour que l'app installée (PWA)
       continue de fonctionner sans redemander le lien à chaque fois.
    */
    const params = new URLSearchParams(window.location.search);
    const urlToken = params.get('cle');
    if (urlToken) {
      localStorage.setItem('dashboardToken', urlToken);
      // Nettoie l'URL affichée pour ne pas laisser le jeton visible à l'écran
      window.history.replaceState({}, '', window.location.pathname);
    }
    const token = urlToken || localStorage.getItem('dashboardToken') || '';

    const lockScreen = document.getElementById('lockScreen');
    const app = document.getElementById('app');

    if (!token || !RSVP_ENDPOINT) {
      lockScreen.querySelector('p').textContent = !RSVP_ENDPOINT
        ? "Le développeur doit encore renseigner RSVP_ENDPOINT dans ce fichier."
        : "Ce dashboard n'est accessible qu'avec le lien privé transmis aux mariés.";
    } else {
      lockScreen.classList.add('hidden');
      app.classList.remove('hidden');
      loadData();
      setInterval(loadData, 60000);
    }

    let allResponses = [];

    function loadData() {
      const callbackName = 'onDashboardData_' + Date.now();
      window[callbackName] = function (data) {
        allResponses = data.reponses || [];
        document.getElementById('statTotal').textContent = data.total ?? 0;
        document.getElementById('statOui').textContent = data.oui ?? 0;
        document.getElementById('statNon').textContent = data.non ?? 0;
        document.getElementById('statVisites').textContent = data.visites ?? 0;
        document.getElementById('statScratchs').textContent = data.scratchs ?? 0;
        document.getElementById('lastUpdate').textContent =
          'Mis à jour à ' + new Date().toLocaleTimeString('fr-FR');
        applyFilters();
        delete window[callbackName];
        script.remove();
      };

      const script = document.createElement('script');
      script.src = RSVP_ENDPOINT + '?cle=' + encodeURIComponent(token) +
        '&callback=' + callbackName + '&t=' + Date.now();
      script.onerror = () => {
        document.getElementById('lastUpdate').textContent = 'Échec du chargement — vérifiez la connexion.';
      };
      document.body.appendChild(script);
    }

    function render(list) {
      const container = document.getElementById('list');
      const empty = document.getElementById('empty');
      container.innerHTML = '';

      if (!list.length) {
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');

      list.forEach(r => {
        const row = document.createElement('div');
        row.className = 'card p-3 gap-3';
        const badgeClass = r.presence === 'Oui' ? 'badge-oui' : 'badge-non';
        const dateStr = r.date ? new Date(r.date).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
        const messageHtml = r.message
          ? `<div class="text-xs text-stone-500 mt-2 italic border-t border-stone-100 pt-2">“${escapeHtml(r.message)}”</div>`
          : '';
        row.innerHTML = `
          <div class="flex items-center justify-between gap-3">
            <div>
              <div class="text-sm font-medium">${escapeHtml(r.prenom)} ${escapeHtml(r.nom)}</div>
              <div class="text-[11px] text-stone-400">${dateStr}</div>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs px-3 py-1 rounded-full ${badgeClass}">${escapeHtml(r.presence)}</span>
              <a href="invitation.html?prenom=${escapeHtml(r.prenom)}&nom=${escapeHtml(r.nom)}" class="bg-wine text-white text-sm text-xs px-3 py-1 rounded-full" >
        Télécharger l'invitation
      </a>
          </div>
              </div>
          ${messageHtml}
        `;
        container.appendChild(row);
      });
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    let currentFilter = 'all';

    function applyFilters() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      render(allResponses.filter(r =>
        (currentFilter === 'all' || r.presence === currentFilter) &&
        (r.nom + ' ' + r.prenom).toLowerCase().includes(q)
      ));
    }

    document.getElementById('search').addEventListener('input', applyFilters);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilters();
      });
    });

    document.getElementById('refreshBtn').addEventListener('click', loadData);

    /* ===================== INSTALLATION PWA ===================== */
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove('hidden');
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.add('hidden');
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => { });
      });
    }
  </script>
</body>

</html>
