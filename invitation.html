<!DOCTYPE html>
<html lang="fr">
<head>
  <script>if(location.hostname==='www.mariagejenniferarnaud.click'||(location.protocol==='http:'&&location.hostname==='mariagejenniferarnaud.click'))location.replace('https://mariagejenniferarnaud.click'+location.pathname+location.search+location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitation — Jennifer & Arnaud</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bordeaux:#7a1528;
    --gold:#b8912f;
    --cream:#f2e9d8;
    --ink:#2a1c1a;
    --gray:#8a7a70;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--cream);
    font-family:'Montserrat',sans-serif;
    min-height:100%;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    gap:22px;
  }
  .stage{
    width:100%;
    max-width:900px;
  }
  .canvas-wrap{
    width:100%;
    aspect-ratio:1800/1120;
    background:#fff;
    border-radius:4px;
    overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(60,10,24,0.35), 0 4px 18px rgba(60,10,24,0.12);
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .caption{
    font-family:'Playfair Display',serif;
    font-style:italic;
    font-size:14px;
    color:var(--gray);
    text-align:center;
  }
  .actions{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  button{
    font-family:'Montserrat',sans-serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.04em;
    padding:14px 34px;
    border-radius:2px;
    cursor:pointer;
    border:1px solid var(--gold);
    background:var(--bordeaux);
    color:#fdf8ee;
    transition:background .25s ease, transform .2s ease;
  }
  button:hover{
    background:#5a0f1e;
    transform:translateY(-1px);
  }
  button:disabled{opacity:.6;cursor:wait;transform:none;}
  button.secondary{
    background:transparent;
    color:var(--bordeaux);
    border-color:rgba(184,145,47,0.6);
  }
  button.secondary:hover{
    background:rgba(184,145,47,0.08);
  }

  @media print{
    body{padding:0;background:#fff;gap:0;}
    .stage{max-width:100%;}
    .canvas-wrap{box-shadow:none;border-radius:0;}
    .caption,.actions{display:none;}
    @page{margin:0;size:A4 landscape;}
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="canvas-wrap">
      <canvas id="invitationCanvas" width="1800" height="1120"></canvas>
    </div>
  </div>


  <div class="actions">
    <button id="dlBtn" onclick="downloadPNG()" disabled>Préparation du billet…</button>
    <button class="secondary" onclick="window.print()">Imprimer / PDF</button>
  </div>

<script>
const canvas = document.getElementById('invitationCanvas');
const ctx = canvas.getContext('2d');
const W = 1800, H = 1120;

const params = new URLSearchParams(window.location.search);
const prenom = (params.get('prenom') || '').trim();
const nom = (params.get('nom') || '').trim();
const guestName = [prenom, nom].filter(Boolean).join(' ') || 'Nom de l\u2019invit\u00e9';


const bgImage = new Image();
bgImage.crossOrigin = "anonymous";
bgImage.src = 'billet-fond.jpg';

let fontsReady = false, imageReady = false;
document.fonts.ready.then(()=>{ fontsReady = true; maybeDraw(); });
bgImage.onload = ()=>{ imageReady = true; maybeDraw(); };
bgImage.onerror = ()=>{ const b = document.getElementById('dlBtn'); if(b) b.textContent = 'Erreur de chargement, actualisez la page'; };

function maybeDraw(){
  if(fontsReady && imageReady) draw();
}
// safety fallback in case one of the two events is slow to fire
setTimeout(()=>{ if(imageReady) draw(); }, 600);

let drawn = false;
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#fbfaf1';
  ctx.fillRect(0,0,W,H);
  ctx.drawImage(bgImage, 0, 0, W, H);
  drawGuestName();
  drawn = true;
  const b = document.getElementById('dlBtn');
  if(b){ b.disabled = false; b.textContent = 'Télécharger mon billet'; }
}

function drawGuestName(){
  const centerX = 990;
  const baselineY = 598;
  const maxWidth = 640;

  let fontSize = 54;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';

  do{
    ctx.font = `italic 600 ${fontSize}px 'Playfair Display'`;
    const w = ctx.measureText(guestName.toUpperCase()).width;
    if(w <= maxWidth) break;
    fontSize -= 2;
  } while(fontSize > 28);

  ctx.fillStyle = '#3a3330';
  ctx.fillText(guestName.toUpperCase(), centerX, baselineY);
}


function saveCanvas(canvas, filename){
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      if(!blob){ resolve(false); return; }
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = filename;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
      resolve(true);
    }, 'image/jpeg', 0.93);
  });
}

async function downloadPNG(){
  if(!drawn){ if(imageReady) draw(); else return; }
  const safeName = (guestName || 'invite').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'_');
  await saveCanvas(canvas, `billet_jennifer_arnaud_${safeName}.jpg`);
}
</script>
</body>
</html>
